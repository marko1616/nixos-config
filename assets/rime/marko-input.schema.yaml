schema:
  schema_id: marko-input
  name: marko-input
  version: "1.0.0"
__include: double_pinyin_flypy.schema.yaml:/
__patch:
  schema/schema_id: marko-input
  schema/name: marko-input
  schema/version: "1.0.0"
  schema/dependencies: [melt_eng, marko-input-radical, marko-input-stroke]
  switches/@0/reset: 0
  switches/@2/reset: 0
  menu/page_size: 7
  ascii_composer/inline_uppercase: false
  ascii_composer/inline_keypad: false
  ascii_composer/switch_key/Shift_L: clear
  engine/processors:
    - ascii_composer
    - lua_processor@*marko_uv_processor
    - lua_processor@*select_character
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  engine/segmentors/@before 0: lua_segmentor@*marko_uv_segmentor
  # The upstream lunar translator assumes a mutable user-local lunar.db.
  # Keep this share-directory deployment independent of user file copies.
  engine/translators:
    - lua_translator@*marko_uv_translator
    - punct_translator
    - script_translator
    - lua_translator@*date_translator
    - lua_translator@*uuid
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - lua_translator@*force_gc
  engine/filters: [lua_filter@*marko_uv_filter]
  # Keep rime_ice as the main dictionary (and retain its user learning database).
  translator/packs: [marko_terms]
  custom_phrase/user_dict: marko_phrase_double
  marko_normal_filters:
    __include: double_pinyin_flypy.schema.yaml:/engine/filters
  recognizer/patterns/unicode: "^$"
  recognizer/patterns/punct: "^$"
  recognizer/patterns/radical_lookup: "^$"
  uv_stroke:
    tag: uv
    dictionary: stroke
    prism: marko-input-stroke
    enable_user_dict: false
    enable_sentence: false
    enable_completion: true
  uv_radical:
    tag: uv
    dictionary: radical_pinyin
    prism: marko-input-radical
    enable_user_dict: false
    enable_sentence: false
    enable_completion: true
