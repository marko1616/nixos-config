[dmenu]
dmenu_command = fuzzel
active_chars = ==
highlight = True
highlight_bold = True
compact = False

wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {name:<{max_len_name}s}  {sec:<{max_len_sec}s} {icon:>4}

list_saved = False
prompt = Wi-Fi

[dmenu_passphrase]
obscure = True

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 1
notification_timeout = 5
show_notifications = True
